<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Background rounded app card -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8" />

  <!-- Grid lines -->
  <path d="M 80 160 L 432 160 M 80 256 L 432 256 M 80 352 L 432 352" stroke="#1e293b" stroke-width="3" stroke-dasharray="6,6" />

  <!-- Filled Area Chart -->
  <path d="M 80 380 L 160 330 L 230 350 L 320 220 L 390 240 L 432 140 L 432 410 L 80 410 Z" fill="url(#chartGrad)" />

  <!-- Breakout Trend Line -->
  <path d="M 80 380 L 160 330 L 230 350 L 320 220 L 390 240 L 432 140" fill="none" stroke="url(#lineGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Candle 1 -->
  <rect x="152" y="310" width="16" height="40" rx="3" fill="#ef4444" />
  <line x1="160" y1="290" x2="160" y2="370" stroke="#ef4444" stroke-width="3" />

  <!-- Candle 2 Breakout -->
  <rect x="312" y="200" width="16" height="50" rx="3" fill="#10b981" />
  <line x1="320" y1="180" x2="320" y2="270" stroke="#10b981" stroke-width="3" />

  <!-- Breakout Flare Circle -->
  <circle cx="432" cy="140" r="18" fill="#10b981" />
  <circle cx="432" cy="140" r="32" fill="#10b981" fill-opacity="0.3" />

  <!-- App Title Text -->
  <text x="256" y="460" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" fill="#f8fafc" text-anchor="middle" letter-spacing="2">ADR TERMINAL</text>
</svg>
